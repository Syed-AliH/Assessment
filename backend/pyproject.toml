[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Notice sentences read better on one line, and zip() lengths are checked by hand.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"config/test_settings.py" = ["F403", "F405", "E402"]
